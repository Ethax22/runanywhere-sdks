name: React Native SDK CI

on:
  push:
    branches: [ main ]
    paths:
      - 'sdk/runanywhere-react-native/**'
      - '.github/workflows/react-native-sdk.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'sdk/runanywhere-react-native/**'
      - '.github/workflows/react-native-sdk.yml'

jobs:
  lint-and-build:
    name: Lint, Type Check and Build React Native SDK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'yarn'
        cache-dependency-path: sdk/runanywhere-react-native/yarn.lock

    - name: Install dependencies
      working-directory: ./sdk/runanywhere-react-native
      run: yarn install --frozen-lockfile

    - name: Run ESLint
      working-directory: ./sdk/runanywhere-react-native
      run: yarn lint

    - name: Run TypeScript type check
      working-directory: ./sdk/runanywhere-react-native
      run: yarn typecheck

    - name: Generate Nitrogen bindings
      working-directory: ./sdk/runanywhere-react-native
      run: yarn nitrogen
      continue-on-error: true

    - name: Build package
      working-directory: ./sdk/runanywhere-react-native
      run: yarn build

  build-ios:
    name: Build iOS Native Module
    runs-on: macos-latest
    needs: lint-and-build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_15.2.app

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'yarn'
        cache-dependency-path: sdk/runanywhere-react-native/yarn.lock

    - name: Install dependencies
      working-directory: ./sdk/runanywhere-react-native
      run: yarn install --frozen-lockfile

    - name: Build iOS
      working-directory: ./sdk/runanywhere-react-native/ios
      run: |
        pod install
        xcodebuild build \
          -workspace RunAnywhereReactNative.xcworkspace \
          -scheme RunAnywhereReactNative \
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.1' \
          -derivedDataPath build
      continue-on-error: true

  build-android:
    name: Build Android Native Module
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'yarn'
        cache-dependency-path: sdk/runanywhere-react-native/yarn.lock

    - name: Install dependencies
      working-directory: ./sdk/runanywhere-react-native
      run: yarn install --frozen-lockfile

    - name: Build Android
      working-directory: ./sdk/runanywhere-react-native/android
      run: ./gradlew build
      continue-on-error: true
